name: s2-v1.0-R1
on:
  schedule: [ { cron: "*/5 * * * *" } ]
  workflow_dispatch: {}
concurrency: { group: s2, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas
      - name: s2
        env: { ODDS_API_KEY: "${{ secrets.ODDS_API_KEY }}" }
        run: python s2.py
      - name: commit (append-only record; a failed push discards this run)
        run: |
          git config user.name "s2-logger"; git config user.email "s2@users.noreply.github.com"
          git add -A log state looks
          git diff --cached --quiet || git commit -m "s2 $(date -u +%FT%TZ)"
          git push || (git pull --rebase --autostash && git push)
